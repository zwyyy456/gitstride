name: Automation
on:
  pull_request:
    paths: ['Automation/**', '.github/workflows/automation.yml']
  push:
    branches: [main]
    paths: ['Automation/**', '.github/workflows/automation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Automation/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
