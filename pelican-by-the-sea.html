<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f1de">
  <title>海风骑行 · A Pelican's Day Off</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #f8f1de; color: #254b4c; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(100%, 1600px); margin: auto; padding: 28px 36px 20px; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    header { padding: 0 3px 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: 3px; font-weight: 600; }
    .brand svg { width: 25px; height: 25px; }
    .edition, footer { font-family: ui-monospace, "SFMono-Regular", monospace; font-size: 10px; letter-spacing: 2px; }
    .art { position: relative; overflow: hidden; border-radius: 5px; background: #efe9cf; }
    .scene { display: block; width: 100%; height: auto; }
    footer { padding: 19px 3px 0; color: #647c73; }
    footer span:last-child { font-family: "PingFang SC", sans-serif; letter-spacing: 3px; }
    .wheel { animation: spin 7s linear infinite; }
    .rider { animation: ride 3s ease-in-out infinite; }
    .cloud { animation: float 14s ease-in-out infinite alternate; }
    .cloud.second { animation-delay: -7s; }
    .wave { animation: tide 5s ease-in-out infinite alternate; }
    .wave.second { animation-delay: -3s; }
    .scarf { animation: flutter 1.7s ease-in-out infinite alternate; transform-origin: 747px 309px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes float { to { transform: translateX(18px); } }
    @keyframes tide { to { transform: translate(16px, 3px); opacity: .6; } }
    @keyframes flutter { to { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .rider, .cloud, .wave, .scarf { animation: none; } }
    @media (max-width: 600px) {
      main { padding: 19px 14px 16px; }
      header { padding-bottom: 15px; }
      .brand { font-size: 10px; letter-spacing: 2px; }
      .edition { font-size: 8px; letter-spacing: 1px; }
      .scene { width: 160%; max-width: none; margin-left: -30%; }
      footer { font-size: 8px; letter-spacing: 1px; gap: 10px; }
      footer span:last-child { letter-spacing: 1px; }
    }
  </style>
</head>
<body>
